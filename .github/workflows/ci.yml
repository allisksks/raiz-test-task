name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: market_map
          POSTGRES_USER: market_map
          POSTGRES_PASSWORD: market_map
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: market_map
      POSTGRES_USER: market_map
      POSTGRES_PASSWORD: market_map
      PGHOST: localhost
      PGPASSWORD: market_map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Init database
        run: ./db/init/01_init.sh
      - run: pytest -m db -v
      - run: pytest -m "not db" -v

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - name: Scheduler loads data on start
        run: |
          for i in $(seq 1 60); do
            n=$(docker compose exec -T db psql -U market_map -d market_map -tAc "select count(*) from staging.load_run where status = 'success'" 2>/dev/null || echo 0)
            [ "${n:-0}" -ge 2 ] && exit 0
            sleep 2
          done
          docker compose logs scheduler
          exit 1
      - run: docker compose run --rm app migrate
      - run: docker compose run --rm app check
      - run: docker compose run --rm app load-1c
      - run: docker compose run --rm app load-prepared
      - name: Marts readable by BI user
        run: docker compose exec -T -e PGPASSWORD=bi_reader db psql -h localhost -U bi_reader -d market_map -v ON_ERROR_STOP=1 -c 'select count(*) from marts.region_summary' -c 'select count(*) from marts.price_comparison' -c 'select count(*) from marts.signals' -c 'select count(*) from marts.hypotheses'
      - name: Dashboards imported
        run: test "$(docker compose exec -T db psql -U market_map -d superset -tAc 'select count(*) from dashboards')" = 2
      - name: Superset health
        run: curl -fs http://localhost:8088/health
      - if: failure()
        run: docker compose logs
