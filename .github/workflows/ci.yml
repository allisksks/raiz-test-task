name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: market_map
          POSTGRES_USER: market_map
          POSTGRES_PASSWORD: market_map
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: market_map
      POSTGRES_USER: market_map
      POSTGRES_PASSWORD: market_map
      PGHOST: localhost
      PGPASSWORD: market_map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Init database
        run: ./db/init/01_init.sh
      - run: pytest -m db -v
      - run: pytest -m "not db" -v

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: docker compose run --rm app check
      - name: Superset health
        run: curl -fs http://localhost:8088/health
      - if: failure()
        run: docker compose logs
