name: market-map

x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-market_map}
  POSTGRES_USER: ${POSTGRES_USER:-market_map}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-market_map}
  BI_READER_USER: ${BI_READER_USER:-bi_reader}
  BI_READER_PASSWORD: ${BI_READER_PASSWORD:-bi_reader}

x-superset-env: &superset-env
  <<: *db-env
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-to-a-long-random-string}
  SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
  SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
  SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}

services:
  db:
    image: postgres:16-alpine
    environment: *db-env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Проверка хранилища; позже здесь же — ETL, сигналы и гипотезы
  app:
    image: market-map-app
    build: .
    profiles: ["tools"]  # не стартует с `up`, запускается через `docker compose run`
    environment:
      <<: *db-env
      ONEC_ODATA_URL: ${ONEC_ODATA_URL:-}
      ONEC_USER: ${ONEC_USER:-}
      ONEC_PASSWORD: ${ONEC_PASSWORD:-}
      PREPARED_DB_URL: ${PREPARED_DB_URL:-sqlite:///data/samples/prepared/prepared.sqlite}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  # Ежедневное обновление: миграции → 1С → подготовленная база → витрины, сигналы,
  # гипотезы. При старте стенда сразу загружает данные (SCHEDULE_RUN_ON_START).
  scheduler:
    image: market-map-app
    build: .
    command: ["schedule"]
    restart: unless-stopped
    environment:
      <<: *db-env
      ONEC_ODATA_URL: ${ONEC_ODATA_URL:-}
      ONEC_USER: ${ONEC_USER:-}
      ONEC_PASSWORD: ${ONEC_PASSWORD:-}
      PREPARED_DB_URL: ${PREPARED_DB_URL:-sqlite:///data/samples/prepared/prepared.sqlite}
      SCHEDULE_TIME: ${SCHEDULE_TIME:-03:00}
      SCHEDULE_TZ: ${SCHEDULE_TZ:-Europe/Moscow}
      SCHEDULE_RUN_ON_START: ${SCHEDULE_RUN_ON_START:-true}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  superset-init:
    build: ./superset
    command: ["/app/bootstrap.sh"]
    environment: *superset-env
    depends_on:
      db:
        condition: service_healthy

  superset:
    build: ./superset
    environment: *superset-env
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  db-data:
