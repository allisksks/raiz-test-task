name: market-map

x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-market_map}
  POSTGRES_USER: ${POSTGRES_USER:-market_map}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-market_map}
  BI_READER_USER: ${BI_READER_USER:-bi_reader}
  BI_READER_PASSWORD: ${BI_READER_PASSWORD:-bi_reader}

x-superset-env: &superset-env
  <<: *db-env
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-to-a-long-random-string}
  SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
  SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
  SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}

services:
  db:
    image: postgres:16-alpine
    environment: *db-env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Проверка хранилища; позже здесь же — ETL, сигналы и гипотезы
  app:
    image: market-map-app
    build: .
    profiles: ["tools"]  # не стартует с `up`, запускается через `docker compose run`
    environment:
      <<: *db-env
      ONEC_ODATA_URL: ${ONEC_ODATA_URL:-}
      ONEC_USER: ${ONEC_USER:-}
      ONEC_PASSWORD: ${ONEC_PASSWORD:-}
      PREPARED_DB_URL: ${PREPARED_DB_URL:-sqlite:///data/samples/prepared/prepared.sqlite}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  # Ежедневное обновление: миграции → 1С → подготовленная база → витрины, сигналы,
  # гипотезы. При старте стенда сразу загружает данные (SCHEDULE_RUN_ON_START).
  scheduler:
    image: market-map-app
    build: .
    command: ["schedule"]
    restart: unless-stopped
    environment:
      <<: *db-env
      ONEC_ODATA_URL: ${ONEC_ODATA_URL:-}
      ONEC_USER: ${ONEC_USER:-}
      ONEC_PASSWORD: ${ONEC_PASSWORD:-}
      PREPARED_DB_URL: ${PREPARED_DB_URL:-sqlite:///data/samples/prepared/prepared.sqlite}
      SCHEDULE_TIME: ${SCHEDULE_TIME:-03:00}
      SCHEDULE_TZ: ${SCHEDULE_TZ:-Europe/Moscow}
      SCHEDULE_RUN_ON_START: ${SCHEDULE_RUN_ON_START:-true}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  superset-init:
    build: ./superset
    command: ["/app/bootstrap.sh"]
    environment: *superset-env
    depends_on:
      db:
        condition: service_healthy

  superset:
    build: ./superset
    environment: *superset-env
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Вторая BI: Metabase поверх тех же витрин marts
  metabase:
    image: metabase/metabase:v0.50.36
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_URL: http://localhost:${METABASE_PORT:-3000}
      MB_SITE_LOCALE: ru
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      MB_LOAD_SAMPLE_CONTENT: "false"
      JAVA_TIMEZONE: Europe/Moscow
    ports:
      - "${METABASE_PORT:-3000}:3000"
    volumes:
      - metabase-data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30

  # Дашборды Metabase как код (metabase/provision.py): собирает их при каждом старте
  # и раздаёт Metabase карту регионов. Healthy — когда дашборды готовы.
  metabase-provision:
    image: market-map-app
    build: .
    entrypoint: ["python", "/metabase/provision.py", "--serve"]
    restart: on-failure
    environment:
      <<: *db-env
      METABASE_URL: http://metabase:3000
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-admin@example.com}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:-market-map-2026}
    volumes:
      - ./metabase:/metabase:ro
    depends_on:
      metabase:
        condition: service_healthy
      scheduler:
        condition: service_started
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/metabase-provisioned"]
      interval: 5s
      timeout: 3s
      retries: 120

volumes:
  db-data:
  metabase-data:
