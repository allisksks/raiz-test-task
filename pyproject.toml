[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "market-map"
version = "0.1.0"
description = "Интерактивная карта России: мониторинг клиентов, конкурентов и цен"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
market-map = "market_map.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_map = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: тесты, которым нужен запущенный PostgreSQL (POSTGRES_* из окружения)",
]

[tool.ruff.lint.per-file-ignores]
# Табличные данные каталога читаются лучше в одну строку
"src/market_map/samples/catalog.py" = ["E501"]
# Раскладка дашбордов — таблица строк и ширин, читается лучше в одну строку
"superset/build_dashboards.py" = ["E501"]
